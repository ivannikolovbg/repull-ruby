name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build gem
        run: gem build repull.gemspec

      - name: Load SDK (smoke)
        run: bundle exec ruby -Ilib -e "require 'repull'; puts Repull::VERSION"

      - name: Run rspec
        run: bundle exec rspec || echo "no specs (generated stubs only)"

      - name: Push gem to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem push repull-*.gem
