# Minimal rubocop config for the generated Repull SDK.
# The bulk of the codebase is auto-generated by openapi-generator-cli (Ruby
# template). We don't own its style, so we exclude generated files entirely
# and lint only our hand-written surface (examples/ + scripts/ + this file).
AllCops:
  TargetRubyVersion: 3.1
  NewCops: disable
  DisabledByDefault: true
  Exclude:
    - 'lib/**/*'
    - 'docs/**/*'
    - 'spec/**/*'
    - 'vendor/**/*'
    - 'openapi/**/*'
    - 'Rakefile'

Layout/IndentationConsistency:
  Enabled: true

Layout/IndentationWidth:
  Enabled: true

Layout/SpaceAroundOperators:
  Enabled: true

Layout/TrailingWhitespace:
  Enabled: true

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes
